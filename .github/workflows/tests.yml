name: Tests

on:
  push:
    branches: [2.x]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        testbench: ['^10.0', '^11.0']
        dependencies: [highest]
        include:
          - php: '8.3'
            testbench: '^10.0'
            dependencies: lowest
          - php: '8.3'
            testbench: '^11.0'
            dependencies: lowest
    name: PHP ${{ matrix.php }} / Testbench ${{ matrix.testbench }} / ${{ matrix.dependencies }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - name: Install dependencies
        env:
          TESTBENCH: ${{ matrix.testbench }}
          DEPENDENCIES: ${{ matrix.dependencies }}
        run: |
          if [ "$DEPENDENCIES" = lowest ]; then
            composer update --with "orchestra/testbench:$TESTBENCH" --prefer-lowest --prefer-stable --prefer-dist --no-interaction
          else
            composer update --with "orchestra/testbench:$TESTBENCH" --prefer-dist --no-interaction
          fi
      - run: composer test
